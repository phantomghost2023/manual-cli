<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="manual-cli: the repository that checks itself.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.55" stop-color="#101830"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.22" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.82" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>
  <g stroke="#ffffff" stroke-opacity="0.045">
    <path d="M0 126 H1200 M0 252 H1200 M0 378 H1200 M0 504 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>
  <rect x="1" y="1" width="1198" height="628" rx="0" fill="none" stroke="url(#edge)" stroke-opacity="0.5" stroke-width="2"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="120" font-size="66" font-weight="700" fill="#f8fafc">manual<tspan fill="#22d3ee">-cli</tspan></text>
    <text x="80" y="172" font-size="30" fill="#94a3b8">The repository that checks itself.</text>
    <text x="80" y="212" font-size="22" fill="#64748b">Every claim about your repo is backed by an executable check.</text>

    <!-- the pipeline -->
    <g font-size="21" font-weight="600" text-anchor="middle">
      <rect x="80" y="252" width="170" height="62" rx="15" fill="#0e7490" fill-opacity="0.28" stroke="#22d3ee" stroke-opacity="0.75" stroke-width="1.8"/>
      <text x="165" y="291" fill="#a5f3fc">claim</text>
      <path d="M258 283 h46" stroke="url(#edge)" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M302 275 l13 8 -13 8 z" fill="#22d3ee"/>

      <rect x="323" y="252" width="170" height="62" rx="15" fill="#6d28d9" fill-opacity="0.28" stroke="#a78bfa" stroke-opacity="0.75" stroke-width="1.8"/>
      <text x="408" y="291" fill="#ddd6fe">check</text>
      <path d="M501 283 h46" stroke="url(#edge)" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M545 275 l13 8 -13 8 z" fill="#a78bfa"/>

      <rect x="566" y="252" width="170" height="62" rx="15" fill="#047857" fill-opacity="0.28" stroke="#34d399" stroke-opacity="0.75" stroke-width="1.8"/>
      <text x="651" y="291" fill="#a7f3d0">verdict</text>
    </g>

    <!-- verifiers -->
    <text x="80" y="382" font-size="20" fill="#94a3b8">Cached installs, verified in milliseconds — eight lockfiles:</text>
    <g font-family="Consolas, Menlo, monospace" font-size="18" font-weight="600" text-anchor="middle">
      <rect x="80"  y="402" width="122" height="44" rx="11" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.55"/><text x="141"  y="430" fill="#a5f3fc">npm</text>
      <rect x="214" y="402" width="122" height="44" rx="11" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.55"/><text x="275"  y="430" fill="#a5f3fc">pnpm</text>
      <rect x="348" y="402" width="122" height="44" rx="11" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.55"/><text x="409"  y="430" fill="#a5f3fc">yarn</text>
      <rect x="482" y="402" width="122" height="44" rx="11" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.55"/><text x="543"  y="430" fill="#a5f3fc">bun</text>
      <rect x="80"  y="454" width="122" height="44" rx="11" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.5"/><text x="141"  y="482" fill="#ddd6fe">venv</text>
      <rect x="214" y="454" width="122" height="44" rx="11" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.5"/><text x="275"  y="482" fill="#ddd6fe">gems</text>
      <rect x="348" y="454" width="122" height="44" rx="11" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.5"/><text x="409"  y="482" fill="#ddd6fe">gomod</text>
      <rect x="482" y="454" width="122" height="44" rx="11" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.5"/><text x="543"  y="482" fill="#ddd6fe">crates</text>
    </g>

    <!-- trust ladder, right column -->
    <g font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" text-anchor="middle">
      <rect x="680" y="402" width="120" height="50" rx="11" fill="#b45309" fill-opacity="0.35" stroke="#fbbf24" stroke-opacity="0.8"/>
      <text x="740" y="433" fill="#fde68a">gold</text>
      <rect x="816" y="402" width="120" height="50" rx="11" fill="#475569" fill-opacity="0.35" stroke="#94a3b8" stroke-opacity="0.8"/>
      <text x="876" y="433" fill="#e2e8f0">silver</text>
      <rect x="952" y="402" width="120" height="50" rx="11" fill="#78350f" fill-opacity="0.35" stroke="#d97706" stroke-opacity="0.8"/>
      <text x="1012" y="433" fill="#fed7aa">bronze</text>
      <rect x="680" y="460" width="120" height="50" rx="11" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-opacity="0.9" stroke-dasharray="6 5"/>
      <text x="740" y="491" fill="#94a3b8">ghost</text>
    </g>
    <text x="680" y="548" font-size="19" fill="#64748b">Trust is earned by running, not written — breaks demote.</text>

    <!-- footer -->
    <rect x="80" y="566" width="1040" height="2" rx="1" fill="url(#edge)" fill-opacity="0.55"/>
    <text x="80" y="602" font-size="21" fill="#94a3b8">Zero dependencies &#183; one command to verify &#183; briefs for humans and agents</text>
  </g>
</svg>
